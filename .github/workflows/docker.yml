name: Docker

# Stack production (compose.yml + Makefile) dibangun dan dijalankan seperti di VPS, lalu diuji:
# nginx + SPA (frontend `main`), API, queue worker, backup dan restore.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Docker (compose smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Checkout frontend (main)
        uses: actions/checkout@v7
        with:
          repository: arianto-sketch/carbon-tracker-frontend
          path: carbon-tracker-frontend

      - name: Siapkan .env dari .env.production.example
        run: |
          cp .env.production.example .env
          sed -i \
            -e "s|^APP_KEY=.*|APP_KEY=base64:$(openssl rand -base64 32)|" \
            -e "s|<domain-anda>|localhost:8080|g" \
            -e "s|^APP_URL=.*|APP_URL=http://localhost:8080|" \
            -e "s|^FRONTEND_URL=.*|FRONTEND_URL=http://localhost:8080|" \
            -e "s|^CORS_ALLOWED_ORIGINS=.*|CORS_ALLOWED_ORIGINS=http://localhost:8080|" \
            -e "s|^DB_PASSWORD=.*|DB_PASSWORD=ci-db-password|" \
            -e "s|^DB_ROOT_PASSWORD=.*|DB_ROOT_PASSWORD=ci-root-password|" \
            -e "s|^MAIL_MAILER=.*|MAIL_MAILER=log|" \
            -e "s|^HTTP_PORT=.*|HTTP_PORT=8080|" \
            .env

      - name: Makefile dan konfigurasi compose
        run: |
          make help
          make compose-check
          # Override HTTPS (Caddy) juga harus valid
          COMPOSE_FILE=compose.yml:compose.tls.yml docker compose config --quiet

      - name: make setup (build, migrate, start)
        run: make setup

      - name: Uji asap
        run: bash .github/scripts/docker-smoke.sh

      - name: Log container
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --timestamps > compose.log

      - name: Upload log container
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: compose-log
          path: compose.log
          retention-days: 7

      - name: Bersihkan
        if: always()
        run: docker compose down -v
