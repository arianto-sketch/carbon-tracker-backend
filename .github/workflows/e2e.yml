name: E2E

# Perubahan backend diuji terhadap UI sungguhan (frontend `main`), supaya PR backend yang
# merusak frontend ketahuan sebelum di-merge. Run harian menangkap perubahan di repo frontend.
on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: carbon_tracker_e2e
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    # Dipakai backend (env menang atas .env). QUEUE sync agar laporan langsung selesai;
    # API_RATE_LIMIT dinaikkan karena akun PM di E2E mendekati batas default 120 request/menit.
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: carbon_tracker_e2e
      DB_USERNAME: root
      DB_PASSWORD: root
      QUEUE_CONNECTION: sync
      API_RATE_LIMIT: 1000

    steps:
      - uses: actions/checkout@v7

      - name: Checkout frontend (main)
        uses: actions/checkout@v7
        with:
          repository: arianto-sketch/carbon-tracker-frontend
          path: frontend

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, zip, gd, intl, bcmath
          coverage: none

      - name: Lokasi cache Composer
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Siapkan backend
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          cp .env.example .env
          php artisan key:generate
          php artisan migrate:fresh --seed --force

      - name: Jalankan backend
        run: |
          nohup php artisan serve --host=127.0.0.1 --port=8000 > "$RUNNER_TEMP/backend.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/up > /dev/null && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/backend.log"
          exit 1

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Siapkan frontend
        working-directory: frontend
        run: |
          npm ci
          cp .env.example .env
          npx playwright install --with-deps chromium

      - name: Playwright
        working-directory: frontend
        run: npx playwright test

      - name: Simpan laporan Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

      - name: Simpan log backend
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-log
          path: ${{ runner.temp }}/backend.log
          retention-days: 14
