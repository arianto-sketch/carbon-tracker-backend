; Tambahan untuk pool www bawaan image php-fpm

[www]
; Sekitar 40 MB per worker: 10 worker cukup untuk VPS 1-2 GB RAM bersama MySQL
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500

; Healthcheck container: cgi-fcgi ke /ping
ping.path = /ping
ping.response = pong

; Env container (dari .env lewat compose) tetap terbaca oleh PHP
clear_env = no

catch_workers_output = yes
decorate_workers_output = no
