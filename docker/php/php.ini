; Pengaturan PHP untuk container production

expose_php = Off
memory_limit = 256M
max_execution_time = 60

; Lampiran entri maks. 5 MB dan file import; nginx membatasi body 12 MB
upload_max_filesize = 10M
post_max_size = 12M

date.timezone = UTC

; Kode tidak berubah selama container hidup (image baru untuk tiap rilis)
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0

realpath_cache_size = 4096K
realpath_cache_ttl = 600
