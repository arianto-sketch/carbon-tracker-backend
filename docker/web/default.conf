# SPA + reverse proxy FastCGI ke Laravel (service "app", php-fpm :9000)

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Lampiran entri maks. 5 MB, file import, dsb.
    client_max_body_size 12m;

    # IP asli klien (untuk rate limit dan audit log Laravel) hanya diambil dari X-Forwarded-For
    # yang dikirim Caddy (compose.tls.yml, IP tetap). Dari sumber lain header itu diabaikan, jadi
    # klien tidak bisa memalsukan IP-nya. Proxy lain di depan (mis. Cloudflare): tambahkan rentang
    # IP-nya di sini.
    set_real_ip_from 172.28.0.10;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    # Nama "app" di-resolve ulang lewat DNS Docker (bukan sekali saat nginx start): setelah container
    # app dibuat ulang (deploy, restore) IP-nya berubah, dan tanpa ini nginx membalas 502.
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $php_fpm app:9000;

    # API dan health check Laravel; header keamanan API diatur middleware SetSecurityHeaders
    location ~ ^/(api/|up$) {
        include fastcgi_params;
        fastcgi_pass $php_fpm;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 120s;
    }

    # Aset hasil build Vite memakai hash di nama file: aman di-cache lama
    location /assets/ {
        expires 1y;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Rute SPA (vue-router history mode); index.html selalu dicek ulang agar rilis baru langsung terpakai
    location / {
        expires -1;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri $uri/ /index.html;
    }
}
