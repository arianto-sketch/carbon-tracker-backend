# SPA + reverse proxy FastCGI ke Laravel (service "app", php-fpm :9000)

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Lampiran entri maks. 5 MB, file import, dsb.
    client_max_body_size 12m;

    # IP asli klien saat ada reverse proxy TLS (Caddy, compose.tls.yml) di jaringan Docker;
    # dipakai Laravel untuk rate limit dan audit log
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API dan health check Laravel; header keamanan API diatur middleware SetSecurityHeaders
    location ~ ^/(api/|up$) {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 120s;
    }

    # Aset hasil build Vite memakai hash di nama file: aman di-cache lama
    location /assets/ {
        expires 1y;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Rute SPA (vue-router history mode); index.html selalu dicek ulang agar rilis baru langsung terpakai
    location / {
        expires -1;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri $uri/ /index.html;
    }
}
